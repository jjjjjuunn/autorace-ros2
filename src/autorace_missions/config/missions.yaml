# AutoRace 미션 파라미터 설정 (2025 국민대 WeBOT 대회)

/mission_manager:
  ros__parameters:
    initial_mission: "COLORED_LANE"
    auto_transition: true
    debug_mode: true

# 미션 1: 색깔 차로 감/가속
/colored_lane:
  ros__parameters:
    debug_mode: true
    slow_speed: 0.08       # 빨강
    normal_speed: 0.15     # 초록
    fast_speed: 0.22       # 파랑
    angular_gain: 0.01

# 미션 2: 횡단보도 정지 후 출발
/crosswalk:
  ros__parameters:
    debug_mode: true
    normal_speed: 0.15
    stripe_threshold: 3
    min_stripe_area: 1000
    detection_confirm_threshold: 3
    roi_top_ratio: 0.5
    roi_bottom_ratio: 0.9
    hough_threshold: 50
    min_line_length: 30
    max_line_gap: 10
    horizontal_angle_threshold: 15

# 미션 3: 라바콘 회피 (LiDAR)
/obstacle_avoidance:
  ros__parameters:
    debug_mode: true
    normal_speed: 0.15
    slow_speed: 0.08
    turn_speed: 0.05
    obstacle_distance: 0.4
    safe_distance: 0.6
    angular_speed: 0.5

# 미션 4: 차선 변경 (마커 감지)
/lane_change:
  ros__parameters:
    debug_mode: true
    normal_speed: 0.15
    lane_change_speed: 0.1
    angular_speed: 0.6
    marker_area_threshold: 3000

# 미션 5: 회전 교차로
/roundabout:
  ros__parameters:
    debug_mode: true
    normal_speed: 0.12
    slow_speed: 0.06
    angular_gain: 0.012
    safe_distance: 0.5
    roundabout_duration: 150

# 미션 6: 터널 암실 주행
/tunnel:
  ros__parameters:
    debug_mode: true
    tunnel_speed: 0.12
    angular_gain: 0.015
    brightness_threshold: 80
    clahe_clip_limit: 2.0
    detection_threshold: 10

# 미션 7: 차단기
/barrier:
  ros__parameters:
    debug_mode: true
    normal_speed: 0.15
    approach_speed: 0.08
    barrier_area_threshold: 5000
    open_angle_threshold: 60

# 미션 8: 주차
/parking:
  ros__parameters:
    debug_mode: true
    parking_speed: 0.08
    reverse_speed: -0.08
    angular_speed: 0.5
    space_width_threshold: 150
    detection_confirm_threshold: 5
